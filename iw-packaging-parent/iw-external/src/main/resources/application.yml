# iw配置
iw:
  dao:
    dataPermission:
      enabled: false
  external:
    dailyhot:
      timeout-ms: ${IW_EXTERNAL_DAILYHOT_TIMEOUT_MS:3000}
      cache-seconds: ${IW_EXTERNAL_DAILYHOT_CACHE_SECONDS:1800}

# 服务器配置
server:
  port: 18006

# spring 配置
spring:
  application:
    name: iw-external-service
  profiles:
    default: dev
  datasource:
    driver-class-name: ${iw.db.driver-class}
    url: ${iw.db.url}
    username: ${iw.db.username}
    password: ${iw.db.password}
  config:
    import:
      - optional:nacos:iw-web
      - optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      discovery:
        enabled: true
      config:
        file-extension: yaml
    password: ${SPRING_CLOUD_NACOS_PASSWORD:}
    username: ${SPRING_CLOUD_NACOS_USERNAME:}
    server-addr: ${SPRING_CLOUD_NACOS_SERVER_ADDR:localhost:8848}

# 静态博客受保护文章访问配置
blog:
  access:
    allowed-origins: ${BLOG_ACCESS_ALLOWED_ORIGINS:https://blog.itwray.com,http://localhost:4000}
    token-secret: ${BLOG_ACCESS_TOKEN_SECRET:}
    default-expires-in: ${BLOG_ACCESS_DEFAULT_EXPIRES_IN:86400}
    scope:
      life:
        password-hash: ${BLOG_ACCESS_SCOPE_LIFE_PASSWORD_HASH:}
        key: ${BLOG_ACCESS_SCOPE_LIFE_KEY:}
